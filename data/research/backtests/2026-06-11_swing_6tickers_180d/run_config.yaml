run_name: swing-quality-long-overbought-short-v5-comparison-crdo-msft-app-intc-mu-nvda-180d
mode: backtest

engine:
  pipeline: tpl
  worker_count: 0
  bounded_capacity: 1000
  indicator_warmup_bars: 50
  ticker_timeout_seconds: 1800
  fail_fast: false

time_window:
  type: rolling
  lookback_days: 180
  warmup_lookback_days: 60
  start:
  end:

tickers:
  - CRDO
  - MSFT
  - APP
  - INTC
  - MU
  - NVDA

market_data:
  provider: alpaca
  download_timeframes:
    - 1d
  derive_from: 1d
  raw_root: data/backtest/raw
  normalized_root: data/backtest/normalized
  results_root: data/backtest/results
  cache_policy: use_cache

providers:
  alpaca:
    data_feed: sip

portfolio:
  starting_capital: 10000
  risk_per_trade_pct: 2.0
  max_position_value_pct: 25.0
  max_concurrent_positions: 4
  fixed_buy_fee: 1.0
  fixed_sell_fee: 1.0
  max_open_trades_per_ticker: 1
  prevent_overlapping_ticker_positions: true

signal_source:
  type: internal_candles
  require_signature: false
  secret_env:
  dedupe_window_seconds: 300
  reject_stale_after_seconds: 0

validation:
  out_of_sample:
    enabled: false
    percent: 0.0
  walk_forward:
    enabled: false
    window_days: 30
    step_days: 10
  benchmark:
    enabled: false
    ticker: SPY
  data_quality:
    enabled: true
    max_duplicate_bars: 0
    max_invalid_ohlc_bars: 0
    max_zero_volume_pct: 10.0
  bias_risk:
    universe_source: manual_swing_watchlist
    universe_as_of_date:
    price_adjustment_policy: alpaca_sip

execution:
  router: simulated
  broker: none
  dry_run: true
  allow_live_orders: false
  order_type: bracket
  order_expiration: gtc
  entry_order_type: limit
  extended_hours: true

news:
  enabled: true
  max_articles_per_ticker: 120
  sentiment_timeout_seconds: 2
  provider:
    name: alpaca
  veto:
    ttl_minutes: 10080
    negative_threshold: -0.55

screener:
  enabled: false
  provider: finviz
  filters:

artifacts:
  retention_mode: summary

strategies:
  - ../strategies/swing-reversal-reclaim-bull-quality-no-news.v1.yaml
  - ../strategies/swing-overbought-rollover-short-no-news.v5.yaml
