apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-flow-web
  namespace: trading-flow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  ingressClassName: nginx
  rules:
    - host: trading-flow.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trading-flow-web
                port:
                  number: 80
