apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trading-flow-paper
resources:
  - namespace.yaml
  - serviceaccounts.yaml
  - configmap.yaml
  - storage.yaml
  - keyvault-secretproviderclasses.yaml
  - web.yaml
  - web-ingress.yaml
  # The Web owner runs existing durable workers in-process. External shards require a separately verified writer migration.
  - warmup-service.yaml
  - networkpolicy.yaml
  - pdb.yaml
images:
  - name: tradingflow-web
    newName: __TRADINGFLOW_REGISTRY__/tradingflow-web
    newTag: __TRADINGFLOW_IMAGE_TAG__
  - name: tradingflow-finbert
    newName: __TRADINGFLOW_REGISTRY__/tradingflow-finbert
    newTag: __TRADINGFLOW_IMAGE_TAG__
  - name: tradingflow-warmup-service
    newName: __TRADINGFLOW_REGISTRY__/tradingflow-warmup-service
    newTag: __TRADINGFLOW_IMAGE_TAG__
