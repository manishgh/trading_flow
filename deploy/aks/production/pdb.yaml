# This SQLite owner deliberately has one replica. Maintenance includes planned downtime.
# No autoscaler may create a second operational writer.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-flow-web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-web
