apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trading-flow-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-web
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trading-flow-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trading-flow-web
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
