# Operational SQLite and warm-up JSON each have one owner on separate local block volumes.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: trading-flow-disk-retained
provisioner: disk.csi.azure.com
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  skuName: StandardSSD_LRS
  fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-flow-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: trading-flow-disk-retained
  resources:
    requests:
      storage: 512Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-flow-warmup-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: trading-flow-disk-retained
  resources:
    requests:
      storage: 512Gi
---
# Only completed, closed backup files use Azure Files; no operational database opens here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: trading-flow-backup-files-retained
provisioner: file.csi.azure.com
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  protocol: smb
  skuName: Standard_ZRS
  resourceGroup: "__TRADINGFLOW_RESOURCE_GROUP__"
  storageAccount: "__TRADINGFLOW_STORAGE_ACCOUNT__"
  storeAccountKey: "false"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: trading-flow-backups-pv
spec:
  capacity:
    storage: 64Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: trading-flow-backup-files-retained
  csi:
    driver: file.csi.azure.com
    readOnly: false
    volumeHandle: trading-flow-backups
    volumeAttributes:
      resourceGroup: "__TRADINGFLOW_RESOURCE_GROUP__"
      storageAccount: "__TRADINGFLOW_STORAGE_ACCOUNT__"
      shareName: tradingflow-backups
      protocol: smb
      storeAccountKey: "false"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: trading-flow-backups
spec:
  accessModes: [ReadWriteMany]
  storageClassName: trading-flow-backup-files-retained
  volumeName: trading-flow-backups-pv
  resources:
    requests:
      storage: 64Gi
