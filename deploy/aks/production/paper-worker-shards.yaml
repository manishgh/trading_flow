apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-flow-paper-worker-shard-0
  labels:
    app.kubernetes.io/name: trading-flow-paper-worker
    tradingflow/shard: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-paper-worker
      tradingflow/shard: "0"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-flow-paper-worker
        tradingflow/shard: "0"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: trading-flow-paper-worker
      terminationGracePeriodSeconds: 90
      nodeSelector:
        workload: trading
      tolerations:
        - key: workload
          operator: Equal
          value: trading
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: trading-flow-paper-worker
      containers:
        - name: worker
          image: tradingflow-worker
          imagePullPolicy: IfNotPresent
          args: ["run", "configs/paper/alpaca-paper.yaml"]
          envFrom:
            - configMapRef:
                name: trading-flow-common
            - secretRef:
                name: trading-flow-paper-secrets
                optional: true
          env:
            - name: TRADINGFLOW_RUNTIME_MODE
              value: paper
            - name: TRADINGFLOW_RESULT_OWNER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: TRADINGFLOW_STOCK_SHARD_ID
              value: "0"
            - name: TRADINGFLOW_STOCKS
              valueFrom:
                configMapKeyRef:
                  name: trading-flow-paper-shards
                  key: shard-0
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache
            - name: paper-secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
        - name: finbert-sentiment
          image: tradingflow-finbert
          imagePullPolicy: IfNotPresent
          ports:
            - name: sentiment
              containerPort: 8088
          env:
            - name: PORT
              value: "8088"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trading-flow-data
        - name: cache
          emptyDir:
            sizeLimit: 50Gi
        - name: paper-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: trading-flow-paper-kv
---
