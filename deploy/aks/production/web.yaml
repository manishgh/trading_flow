apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-flow-web
  labels:
    app.kubernetes.io/name: trading-flow-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-flow-web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: trading-flow-web
      terminationGracePeriodSeconds: 45
      containers:
        - name: web
          image: tradingflow-web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: trading-flow-common
            - secretRef:
                name: trading-flow-paper-secrets
                optional: true
          env:
            - name: TRADINGFLOW_RESULT_OWNER
              value: web
            - name: TRADINGFLOW_RUNTIME_MODE
              value: paper
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache
            - name: ui-runs
              mountPath: /app/configs/backtest/ui-runs
            - name: paper-secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trading-flow-data
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: ui-runs
          persistentVolumeClaim:
            claimName: trading-flow-ui-runs
        - name: paper-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: trading-flow-paper-kv
---
apiVersion: v1
kind: Service
metadata:
  name: trading-flow-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trading-flow-web
  ports:
    - name: http
      port: 80
      targetPort: http
