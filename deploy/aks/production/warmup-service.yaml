apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-flow-warmup-service
  labels:
    app.kubernetes.io/name: trading-flow-warmup-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-warmup-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trading-flow-warmup-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: trading-flow-paper-worker
      terminationGracePeriodSeconds: 60
      nodeSelector:
        workload: trading
      tolerations:
        - key: workload
          operator: Equal
          value: trading
          effect: NoSchedule
      containers:
        - name: warmup
          image: tradingflow-warmup-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: trading-flow-common
            - secretRef:
                name: trading-flow-paper-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: cache
              mountPath: /app/cache
            - name: paper-secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: trading-flow-data
        - name: cache
          emptyDir:
            sizeLimit: 50Gi
        - name: paper-secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: trading-flow-paper-kv
---
apiVersion: v1
kind: Service
metadata:
  name: trading-flow-warmup-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trading-flow-warmup-service
  ports:
    - name: http
      port: 80
      targetPort: http
