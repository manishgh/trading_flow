apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-flow-default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-flow-allow-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-flow-worker-local-sidecar-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-paper-worker
  policyTypes:
    - Ingress
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-flow-allow-warmup-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-flow-warmup-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
