run_name: semiconductors-research
mode: backtest

engine:
  pipeline: tpl
  worker_count: 0
  bounded_capacity: 1000
  indicator_warmup_bars: 150
  fail_fast: false

time_window:
  type: rolling
  lookback_days: 60
  start:
  end:

tickers:
  - MU
  - NVDA
  - AMD
  - INTC
  - QCOM
  - ASML
  - TSM
  - MXL
  - OUST
  - MSFT
  - AAPL
  - GOOGL
  - AMZN
  - TSLA

market_data:
  provider: yahoo
  download_timeframes:
    - 5m
  derive_from: 5m
  raw_root: data/backtest/raw
  normalized_root: data/backtest/normalized
  results_root: data/backtest/results
  cache_policy: refresh

providers:
  yahoo:
    api:
      base_url: https://query1.finance.yahoo.com
      chart_path: /v8/finance/chart/{ticker}
    headers:
      user_agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
      accept: application/json,text/plain,*/*
      accept_language: en-US,en;q=0.9
    request_timeout_seconds: 30
    max_retries: 3
    throttle_ms: 250

portfolio:
  starting_capital: 100000
  risk_per_trade_pct: 1.0
  max_position_value_pct: 20.0
  max_concurrent_positions: 5
  fixed_buy_fee: 1.0
  fixed_sell_fee: 1.0
  prevent_overlapping_ticker_positions: true

signal_source:
  type: internal_candles
  require_signature: false
  secret_env:
  dedupe_window_seconds: 300
  reject_stale_after_seconds: 0

validation:
  out_of_sample:
    enabled: true
    percent: 30.0
  walk_forward:
    enabled: true
    window_days: 10
    step_days: 5
  benchmark:
    enabled: true
    ticker: SPY
  data_quality:
    enabled: true
    max_duplicate_bars: 0
    max_invalid_ohlc_bars: 0
    max_zero_volume_pct: 10.0
  bias_risk:
    universe_source: static_config
    universe_as_of_date:
    price_adjustment_policy: yahoo_chart_quote

execution:
  router: simulated
  broker: none
  dry_run: true
  allow_live_orders: false
  order_type: bracket
  order_expiration: gtc
  entry_order_type: limit

news:
  enabled: false

strategies:
  - ../strategies/intraday-vwap-pullback.v2.yaml
  - ../strategies/opening-range-breakout.v2.yaml
  - ../strategies/swing-trend-pullback.v1.yaml
  - ../strategies/swing-vwap-momentum.v2.yaml
  - ../strategies/minervini-trend-breakout.v2.yaml
