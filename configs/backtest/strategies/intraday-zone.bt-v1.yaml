# Approved close-pivot 15m zones / completed 5m VWAP and same-clock median-volume confirmations.
strategy_id: technical.zone-intraday
strategy_name: Strategy 1 Intraday
source: user_intraday_zone_2026_10_29
version: 1
timeframe: 15m
direction: long_short
entry_rules:
  setup_type: intraday_zone
  intraday_zone:
    policy_id: intraday-close-pivot-zones-v1
    max_filled_parent_trades_per_session: 2
    pivot_strength: 3
    prior_session_count: 5
    merge_atr_multiple: 0.35
    flip_atr_multiple: 0.2
  enable_short: true
  short_setup_type: intraday_zone
  min_volume_spike: 0
  volume_confirmation_mode: none
  min_entry_rsi: 0
  max_entry_rsi: 100
  trend_filter: none
  macd_filter: none
  require_price_above_bb_middle: false
  require_macd_histogram_positive: false
  require_price_below_vwap_for_short: false
  require_macd_bearish_for_short: false
  require_positive_news: false
confluence:
  enabled: false
  timeframe: 5m
  ema_period: 20
  macd_filter: none
exit_rules:
  stop_atr_multiple: 1
  target_r_multiple: 3
  max_hold_hours: 6.5
  enable_atr_trailing_stop: false
  initial_stop_mode: breakout_candle
  profit_target_mode: r_multiple
  allow_same_bar_stop_target: true
  continuation_protection:
    activation_r: 2.4
    cost_buffer_ticks: 1
    confirmation_bars: 2
    target_step_r: 1
execution:
  timeframe: 5m
  slippage_bps: 10
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 0
  close_buffer_minutes: 5
  friday_close_buffer_minutes: 5
