# TEMPORARY COMPARISON VARIANT (23 November 2026) of technical.bollinger-squeeze-breakdown@1.0.0 (bollinger-squeeze-breakdown.bt-v1.yaml):
# identical except the market gate: SPY/QQQ 50-day gate kept, the VIX sizing lines removed. Delete after the gate comparison unless it is proposed as the next version.
# Bollinger squeeze breakdown, swing, short. Design: docs/design-review/2026-11-19/swing-8-strategies-and-ui-design.md
# (approved 19 November 2026, Checkpoints 7 & 8). Short mirror of technical.bollinger-squeeze-breakout@1.0.0:
# prior session's Bollinger band width ranks in the lowest 15% of the 60 widths ending that session, signal bar closes
# below the 10-session low on RVOL >= 1.5 with close in the bottom quarter (CLV <= 0.25), strategy-owned 20-session
# ADR% >= 2.5% and dollar volume >= $20M, under the bearish SPY/QQQ falling 50-day SMA gate and short FRED VIXCLS
# sizing (< 18 refused, 18-22 half risk, > 22 full risk). Charges 1.0% annualized short-borrow cost in backtest
# accounting and enforces SEC Rule 201 short-sale restrictions. As-traded (unadjusted) daily bars.
strategy_id: research.bollinger-squeeze-breakdown.bt-v1
strategy_name: RESEARCH Bollinger Squeeze Breakdown V1 (swing, short, SPY/QQQ falling-average gate, short VIX sizing, as-traded bars)
source: bollinger_2001_bollinger_on_bollinger_bands_the_squeeze_short_mirror
version: 1
timeframe: 1d
direction: short
entry_rules:
  setup_type: momentum
  enable_short: true
  short_setup_type: bollinger_squeeze_breakdown
  bollinger_squeeze_lookback_bars: 60
  max_bollinger_width_percentile: 0.15
  recent_low_lookback_bars: 10
  min_volume_spike: 1.5
  volume_confirmation_mode: hard_gate
  max_short_close_location_value: 0.25
  min_average_range_pct: 2.5
  min_average_dollar_volume: 20000000
  min_entry_rsi: 0.0
  max_entry_rsi: 100.0
  trend_filter: none
  macd_filter: none
  require_price_above_bb_middle: false
  require_macd_histogram_positive: false
  require_price_above_vwap: false
  require_price_above_ema20: false
  require_price_above_ema50: false
  require_ema20_above_ema50: false
  require_price_above_sma200: false
  require_price_below_vwap_for_short: false
  require_macd_bearish_for_short: false
  portfolio_rank_mode: none
  max_vwap_extension_atr:
  require_positive_news: false
regime:
  benchmark: SPY
  rule: price_below_falling_sma
  sma_period: 50
  sma_falling_lookback_bars: 20
  nasdaq_listing_benchmark: QQQ
confluence:
  enabled: false
  timeframe: 1d
  ema_period: 200
  macd_filter: none
exit_rules:
  stop_atr_multiple: 1.0
  target_r_multiple: 2.5
  max_hold_hours: 10000.0
  max_hold_bars: 10
  exit_on_rsi2_above:
  exit_on_close_above_sma5: false
  enable_atr_trailing_stop: false
  trailing_stop_atr_multiple: 2.0
  trailing_activation_r: 1.0
  exit_on_close_below_ema20: false
  exit_on_close_below_vwap: false
  exit_on_macd_histogram_negative: false
  min_hold_bars_before_technical_exit: 1
  initial_stop_mode: atr
  profit_target_mode: r_multiple
  allow_same_bar_stop_target: false
execution:
  timeframe: 1d
  slippage_bps: 5.0
  opening_gap_policy: keep_and_exit_next_open
  short_borrow_apr_pct: 1.0
  enforce_sec_rule_201: true
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 0
  close_buffer_minutes: 30
  friday_close_buffer_minutes: 30
