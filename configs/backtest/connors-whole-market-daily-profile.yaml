# Run profile for the Connors RSI(2) whole-market research screens (design docs/design-review/2026-11-11/connors-whole-market-design.md,
# approved 11 November 2026): daily bars only, read from the evidence catalog; $100,000, at most 10 positions of 10% each;
# 10 bps slippage per side comes from the strategy files; no commission (Alpaca), SEC and FINRA sell fees kept.
# max_retained_replay_bars 5,200,000: about 2,000 stocks x 7.5 years x 252 sessions (3.78M) plus the 400-day warm-up
# (about 275 sessions x 2,000 = 0.55M), with 20% room for days on which more than 2,000 stocks are eligible.

run_name: connors-whole-market-daily-profile
mode: backtest

engine:
  pipeline: tpl
  worker_count: 0
  bounded_capacity: 2000
  indicator_warmup_bars: 260
  allow_late_warmup: true
  ticker_timeout_seconds: 1800
  max_retained_replay_bars: 5200000
  max_strategy_work_items: 10000
  max_retained_candidates: 1000000
  fail_fast: false

time_window:
  type: rolling
  # Diagnostic six-month window. Promotion-grade research uses the frozen
  # point-in-time research datasets and 2016-or-later program boundaries.
  lookback_days: 180
  # 260 indicator bars are trading sessions, not calendar days. Four hundred
  # calendar days supplies the required pre-evaluation history with margin.
  warmup_lookback_days: 400
  start:
  end:

market_data:
  provider: alpaca
  download_timeframes:
    - 1d
  derive_from: 1d
  raw_root: data/backtest/raw
  normalized_root: data/backtest/normalized
  results_root: data/backtest/results
  cache_policy: use_cache

providers:
  alpaca:
    data_feed: sip

portfolio:
  starting_capital: 100000
  account_risk_budget_pct: 1.0
  max_position_notional_pct: 10
  max_concurrent_positions: 10
  fixed_buy_fee: 0
  fixed_sell_fee: 0
  max_execution_order_history: 1000000
  prevent_overlapping_ticker_positions: true
  max_bar_participation_pct: 5.0
  sec_fee_rate: 0.0000278
  finra_taf_per_share: 0.000166
  finra_taf_cap: 8.30

signal_source:
  type: internal_candles
  require_signature: false
  secret_env:
  dedupe_window_seconds: 300
  reject_stale_after_seconds: 0

validation:
  out_of_sample:
    enabled: true
    percent: 30.0
  walk_forward:
    enabled: true
    window_days: 30
    step_days: 15
  benchmark:
    enabled: true
    ticker: SPY
  data_quality:
    enabled: true
    max_duplicate_bars: 0
    max_invalid_ohlc_bars: 0
    max_zero_volume_pct: 15.0
  bias_risk:
    universe_source: wishlist
    universe_as_of_date:
    price_adjustment_policy: alpaca_sip_cached

execution:
  router: simulated
  broker: none
  dry_run: true
  allow_live_orders: false
  order_type: bracket
  allow_extended_hours_trading: false

news:
  enabled: true
  provider:
    name: alpaca
  veto:
    ttl_minutes: 1440
    negative_threshold: -0.55
  max_articles_per_ticker: 500
  sentiment_timeout_seconds: 3

artifacts:
  retention_mode: full

universe:
  mode: unresolved_wishlist

strategies:
  - strategies/swing-connors-rsi2-sma5-risk-managed.bt-v7.yaml

