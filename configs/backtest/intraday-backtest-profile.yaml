run_name: intraday-backtest-profile
mode: backtest

engine:
  pipeline: tpl
  worker_count: 0
  bounded_capacity: 2000
  indicator_warmup_bars: 200
  ticker_timeout_seconds: 1800
  fail_fast: false

time_window:
  type: rolling
  lookback_days: 60
  warmup_lookback_days: 90
  start:
  end:

tickers:

market_data:
  provider: alpaca
  download_timeframes:
    - 1m
    - 5m
  derive_from: 1m
  raw_root: data/backtest/raw
  normalized_root: data/backtest/normalized
  results_root: data/backtest/results
  cache_policy: use_cache

providers:
  alpaca:
    data_feed: sip

portfolio:
  starting_capital: 10000
  account_risk_budget_pct: 1.0
  max_position_notional_pct: 25
  max_concurrent_positions: 4
  fixed_buy_fee: 1.0
  fixed_sell_fee: 1.0
  prevent_overlapping_ticker_positions: true

signal_source:
  type: internal_candles
  require_signature: false
  secret_env:
  dedupe_window_seconds: 300
  reject_stale_after_seconds: 0

validation:
  out_of_sample:
    enabled: false
    percent: 0.0
  walk_forward:
    enabled: false
    window_days: 10
    step_days: 5
  benchmark:
    enabled: false
    ticker: SPY
  data_quality:
    enabled: true
    max_duplicate_bars: 0
    max_invalid_ohlc_bars: 0
    max_zero_volume_pct: 15.0
  bias_risk:
    universe_source: wishlist
    universe_as_of_date:
    price_adjustment_policy: alpaca_sip_cached

execution:
  router: simulated
  broker: none
  dry_run: true
  allow_live_orders: false
  order_type: bracket
  allow_extended_hours_trading: false

news:
  enabled: false
  provider:
    name: alpaca
  veto:
    ttl_minutes: 1440
    negative_threshold: -0.55

artifacts:
  retention_mode: full

strategies:
  - ../strategies/intraday-ema10-ema20-macd-volume.v1.yaml


