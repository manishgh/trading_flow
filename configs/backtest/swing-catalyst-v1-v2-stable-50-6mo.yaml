run_name: swing-catalyst-v1-v2-stable-50-6mo
mode: backtest

engine:
  pipeline: tpl
  worker_count: 4
  bounded_capacity: 1000
  indicator_warmup_bars: 220
  ticker_timeout_seconds: 1800
  fail_fast: false

time_window:
  type: rolling
  lookback_days: 180
  warmup_lookback_days: 260
  start:
  end:

tickers:
  - AAPL
  - MSFT
  - GOOGL
  - AMZN
  - META
  - NVDA
  - AVGO
  - JPM
  - BAC
  - V
  - MA
  - PG
  - KO
  - PEP
  - WMT
  - COST
  - HD
  - LOW
  - UNH
  - JNJ
  - MRK
  - ABBV
  - LLY
  - PFE
  - XOM
  - CVX
  - COP
  - MCD
  - SBUX
  - NKE
  - DIS
  - NFLX
  - CRM
  - ORCL
  - CSCO
  - IBM
  - INTC
  - QCOM
  - TXN
  - AMD
  - ADI
  - AMAT
  - CAT
  - DE
  - GE
  - HON
  - UPS
  - RTX
  - NEE
  - DUK

market_data:
  provider: alpaca
  download_timeframes:
    - 1h
    - 1d
  derive_from: 1h
  raw_root: data/backtest/raw/stable-50-6mo
  normalized_root: data/backtest/normalized/stable-50-6mo
  results_root: data/backtest/results/stable-50-6mo
  cache_policy: use_cache

providers:
  alpaca:
    data_feed: sip

portfolio:
  starting_capital: 100000
  risk_per_trade_pct: 1.0
  max_position_value_pct: 10.0
  max_concurrent_positions: 10
  fixed_buy_fee: 1.0
  fixed_sell_fee: 1.0
  max_open_trades_per_ticker: 1
  prevent_overlapping_ticker_positions: true

signal_source:
  type: internal_candles
  require_signature: false
  secret_env:
  dedupe_window_seconds: 300
  reject_stale_after_seconds: 0

validation:
  out_of_sample:
    enabled: false
    percent: 0.0
  walk_forward:
    enabled: false
    window_days: 30
    step_days: 10
  benchmark:
    enabled: false
    ticker: SPY
  data_quality:
    enabled: true
    max_duplicate_bars: 0
    max_invalid_ohlc_bars: 0
    max_zero_volume_pct: 10.0
  bias_risk:
    universe_source: manual_large_cap_stable_50
    universe_as_of_date: 2026-06-16
    price_adjustment_policy: alpaca_sip

execution:
  router: simulated
  broker: none
  dry_run: true
  allow_live_orders: false
  order_type: bracket
  order_expiration: gtc
  entry_order_type: limit
  extended_hours: true

news:
  enabled: true
  max_articles_per_ticker: 120
  sentiment_timeout_seconds: 2
  provider:
    name: alpaca
  veto:
    ttl_minutes: 10080
    negative_threshold: -0.55

screener:
  enabled: false
  provider: finviz
  filters:

artifacts:
  retention_mode: summary

strategies:
  - ../strategies/swing-catalyst-confirmation-long.v1.yaml
  - ../strategies/swing-catalyst-confirmation-long.v2-adx-obv.yaml
