# Run profile for the Connors RSI(2) one-year hourly-entry test (design docs/design-review/2026-11-11/connors-whole-market-design.md,
# amended 12 November 2026): daily and hourly bars from the evidence catalog (the hourly datasets collected for the
# screen's eligible list); $100,000, at most 10 positions of 10% each; 10 bps slippage per side from the strategy files;
# no commission (Alpaca), SEC and FINRA sell fees kept. Both timeframes are read directly, so nothing is derived.
# max_retained_replay_bars 4,100,000: about 1,500 stocks x 252 sessions x 7 hourly bars (Alpaca clock-aligned bars that
# overlap 09:30-16:00; 6 or 7 a session) = 2.65M, plus daily bars for the year and its 365-day warm-up (about 252 + 251
# sessions x 1,500 = 0.75M), with 20% room = 4.08M, rounded up.

run_name: connors-whole-market-hourly-profile
mode: backtest

engine:
  pipeline: tpl
  worker_count: 0
  bounded_capacity: 2000
  # Connors reads at most 200 sessions (SMA200); 250 leaves margin and fits the 2016 start of the daily data.
  indicator_warmup_bars: 250
  allow_late_warmup: true
  ticker_timeout_seconds: 1800
  max_retained_replay_bars: 4100000
  max_strategy_work_items: 10000
  max_retained_candidates: 1000000
  fail_fast: false

time_window:
  type: rolling
  # Diagnostic six-month window. Promotion-grade research uses the frozen
  # point-in-time research datasets and 2016-or-later program boundaries.
  lookback_days: 180
  # 250 indicator bars are trading sessions, not calendar days. 365 calendar days
  # (about 252 sessions) cover them and fit the daily data and calendar, which start 1 Jan 2016.
  warmup_lookback_days: 365
  start:
  end:

market_data:
  provider: alpaca
  download_timeframes:
    - 1d
    - 1h
  derive_from: 1d
  raw_root: data/backtest/raw
  normalized_root: data/backtest/normalized
  results_root: data/backtest/results
  cache_policy: use_cache

providers:
  alpaca:
    data_feed: sip

portfolio:
  starting_capital: 100000
  account_risk_budget_pct: 1.0
  max_position_notional_pct: 10
  max_concurrent_positions: 10
  fixed_buy_fee: 0
  fixed_sell_fee: 0
  max_execution_order_history: 1000000
  prevent_overlapping_ticker_positions: true
  max_bar_participation_pct: 5.0
  sec_fee_rate: 0.0000278
  finra_taf_per_share: 0.000166
  finra_taf_cap: 8.30

signal_source:
  type: internal_candles
  require_signature: false
  secret_env:
  dedupe_window_seconds: 300
  reject_stale_after_seconds: 0

validation:
  out_of_sample:
    enabled: true
    percent: 30.0
  walk_forward:
    enabled: true
    window_days: 30
    step_days: 15
  benchmark:
    enabled: true
    ticker: SPY
  data_quality:
    enabled: true
    max_duplicate_bars: 0
    max_invalid_ohlc_bars: 0
    max_zero_volume_pct: 15.0
  bias_risk:
    universe_source: wishlist
    universe_as_of_date:
    price_adjustment_policy: alpaca_sip_cached

execution:
  router: simulated
  broker: none
  dry_run: true
  allow_live_orders: false
  order_type: bracket
  allow_extended_hours_trading: false

news:
  enabled: true
  provider:
    name: alpaca
  veto:
    ttl_minutes: 1440
    negative_threshold: -0.55
  max_articles_per_ticker: 500
  sentiment_timeout_seconds: 3

artifacts:
  retention_mode: full

universe:
  mode: unresolved_wishlist

strategies:
  - strategies/swing-connors-rsi2-published-decision-hour.bt-v9-2.yaml

