strategy_id: research.swing-trend-pullback.v1
strategy_name: Swing Trend Pullback
source: research_playbook.swing_trend_pullback
version: 1
timeframe: 1h
direction: long
entry_rules:
  setup_type: trend_pullback
  min_volume_spike: 1.2
  min_entry_rsi: 45.0
  max_entry_rsi: 70.0
  trend_filter: ema20_above_ema50
  macd_filter: not_bearish
  require_price_above_bb_middle: false
  require_macd_histogram_positive: false
  require_price_above_vwap: false
  require_price_above_ema20: true
  require_price_above_ema50: true
  require_ema20_above_ema50: true
  max_vwap_extension_atr:
  opening_range_minutes: 15
  recent_high_lookback_bars: 20
  volatility_contraction_lookback_bars: 10
confluence:
  enabled: false
  timeframe: 1h
  ema_period: 50
  macd_filter: none
exit_rules:
  stop_atr_multiple: 2.0
  target_r_multiple: 4.0
  max_hold_hours: 72.0
execution:
  timeframe: 5m
  slippage_bps: 8.0
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 0
  close_buffer_minutes: 0
  friday_close_buffer_minutes: 0
