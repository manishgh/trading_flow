strategy_id: research.intraday-ross-vwap-ema-cumulative-volume.v8-adaptive-guard
strategy_name: TOP1 Intraday - Dual RVOL Lite V8 Adaptive Guard
source: v6_fast_entry_with_selective_quality_guards_from_v7_forensics
version: 8
timeframe: 1m
direction: long
entry_rules:
  setup_type: indicator_stack
  min_volume_spike: 2.0
  min_volume_spike_source: cumulative_same_time
  volume_confirmation_mode: hard_gate
  min_session_relative_volume: 0.70
  require_volume_sma_rising: false
  volume_sma_period: 5
  volume_sma_rising_lookback_bars: 3
  min_volume_sma_rise_pct:
  min_entry_rsi: 0.0
  max_entry_rsi: 100.0
  trend_filter: none
  macd_filter: not_bearish
  require_price_above_bb_middle: false
  require_macd_histogram_positive: true
  require_price_above_vwap: true
  require_price_above_ema10: true
  require_price_above_ema20: true
  require_ema10_above_ema20: true
  require_price_above_ema50: false
  require_ema20_above_ema50: false
  max_vwap_extension_atr:
  opening_range_minutes: 0
  recent_high_lookback_bars: 0
  volatility_contraction_lookback_bars: 0
  require_log_price_rising: false
  require_log_volume_rising: false
  log_price_lookback_bars: 6
  log_volume_lookback_bars: 6
  min_log_price_slope: 0.0
  min_log_volume_slope: 0.0
  reject_falling_price_rising_volume: false
  vwap_hold_bars: 1
  max_entries_per_ticker_per_day: 1
  min_close_location_value: 0.20
  reject_weak_close_on_high_relative_volume: true
  weak_close_max_location_value: 0.35
  weak_close_min_relative_volume: 2.0
  min_day_gain_pct:
  min_session_gain_pct:
  max_pre_entry_session_range_pct:
  max_entry_pullback_from_session_high_pct:
  require_positive_news: false
  min_news_sentiment:
  veto_news_sentiment_below:
  max_news_age_hours: 18
  enable_entry_bar_confirmation: false
  min_entry_bar_close_location_value: 0.60
  reject_entry_bar_close_location_below_minimum: false
  reject_entry_bar_breaks_signal_midpoint: false
  max_vwap_extension_pct_for_direct_entry: 6.0
  extended_vwap_min_entry_bar_close_location_value: 0.70
  max_bollinger_position_for_direct_entry:
  extended_bollinger_min_entry_bar_close_location_value:
risk_guards:
  per_ticker_daily:
    enabled: true
    max_failed_trades: 1
    max_loss_r: 1.0
    max_loss_pct_of_account: 1.0
confluence:
  enabled: false
  timeframe: 5m
  ema_period: 50
  macd_filter: none
exit_rules:
  stop_atr_multiple: 2.0
  target_r_multiple: 3.0
  max_hold_hours: 6.5
  enable_atr_trailing_stop: true
  trailing_stop_atr_multiple: 2.0
  trailing_activation_r: 1.0
  exit_on_close_below_ema20: false
  exit_on_close_below_vwap: false
  exit_on_macd_histogram_negative: false
  min_hold_bars_before_technical_exit: 5
  enable_confirmed_vwap_exit: true
  confirmed_vwap_exit_bars: 3
  confirmed_vwap_exit_atr_buffer: 0.15
  disable_confirmed_vwap_exit_after_r: 1.0
  exit_on_log_price_fade: false
  exit_log_price_lookback_bars: 6
  exit_log_volume_lookback_bars: 6
  max_exit_log_price_slope: -0.0001
  min_exit_log_volume_slope: 0.003
  require_rising_volume_for_log_fade_exit: false
  require_below_vwap_for_log_fade_exit: false
  exit_on_sma10_near_sma20: false
  sma10_near_sma20_pct: 0.20
  exit_on_sma10_cross_below_sma20: false
  exit_on_ema10_cross_below_ema20: true
execution:
  timeframe: 1m
  slippage_bps: 10.0
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 1
  close_buffer_minutes: 30
  friday_close_buffer_minutes: 30
