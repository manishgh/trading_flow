strategy_id: research.minervini-trend-template-vcp.v4-trend-rider
strategy_name: Minervini Trend Template & VCP Breakout V4 - Trend Rider
source: mark_minervini_trade_like_a_stock_market_wizard
version: 4
timeframe: 1d
direction: long
entry_rules:
  setup_type: volatility_contraction_pattern
  min_volume_spike: 0.0
  min_entry_rsi: 45.0
  max_entry_rsi: 85.0
  trend_filter: none
  macd_filter: not_bearish
  # L3 gate discipline (doctrine §2, <=4 independent gates): "uptrend intact" is ONE concept.
  # price>ema20 and price>ema50 are implied by price>ema10 AND ema10>ema20>ema50, and price>bb_middle
  # is correlated with the same fact — correlated gates add curve-fitting DOF, not edge. Kept the
  # minimal expressive set: price above an aligned upward EMA stack.
  require_price_above_bb_middle: false
  require_macd_histogram_positive: true
  require_price_above_vwap: false
  require_price_above_ema10: true
  require_price_above_ema20: false
  require_price_above_ema50: false
  require_ema10_above_ema20: true
  require_ema20_above_ema50: true
  max_vwap_extension_atr:
  opening_range_minutes: 15
  recent_high_lookback_bars: 20
  volatility_contraction_lookback_bars: 25
  require_log_price_rising: false
  require_log_volume_rising: false
  log_price_lookback_bars: 12
  log_volume_lookback_bars: 12
  min_log_price_slope: 0
  min_log_volume_slope: 0
  min_log_price_r2:
  min_log_volume_r2:
  reject_falling_price_rising_volume: false
  red_volume_max_price_slope: -0.0001
  red_volume_min_volume_slope: 0.003
  vwap_hold_bars: 2
  max_entries_per_ticker_per_day: 1
  min_close_location_value: 0.55
  reject_weak_close_on_high_relative_volume: false
  weak_close_max_location_value: 0.40
  weak_close_min_relative_volume: 1.0
  min_day_gain_pct:
  min_session_gain_pct:
  max_pre_entry_session_range_pct:
  max_entry_pullback_from_session_high_pct:
  require_positive_news: false
  min_news_sentiment:
  veto_news_sentiment_below:
  max_news_age_hours: 72
  min_catalyst_price_move_pct:
  max_catalyst_price_move_pct:
# L2 regime (doctrine §6A): only take new long entries while SPY's prior close is above its
# 50-day SMA, so the trend-continuation edge isn't just long-only sector beta in any tape.
regime:
  benchmark: SPY
  rule: price_above_sma
  sma_period: 50
confluence:
  enabled: false
  timeframe: 1d
  ema_period: 50
  macd_filter: none
exit_rules:
  stop_atr_multiple: 2.5
  target_r_multiple: 10.0
  max_hold_hours: 2160.0
  enable_atr_trailing_stop: true
  trailing_stop_atr_multiple: 2.5
  trailing_activation_r: 2.0
  exit_on_close_below_ema20: true
  # L5 (doctrine §6A): confirmed two-close EMA20 loss, not a single-touch that shakes out trend legs.
  require_confirmed_ema20_exit: true
  exit_on_close_below_vwap: false
  exit_on_macd_histogram_negative: false
  min_hold_bars_before_technical_exit: 1
  exit_on_log_price_fade: false
  exit_log_price_lookback_bars: 6
  exit_log_volume_lookback_bars: 6
  max_exit_log_price_slope: -0.0001
  min_exit_log_volume_slope: 0.003
  require_rising_volume_for_log_fade_exit: false
  require_below_vwap_for_log_fade_exit: false
execution:
  timeframe: 1d
  slippage_bps: 10.0
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 0
  close_buffer_minutes: 30
  friday_close_buffer_minutes: 30
