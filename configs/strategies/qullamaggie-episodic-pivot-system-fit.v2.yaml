strategy_id: research.qullamaggie-swing-episodic-pivot.system-fit.v2
strategy_name: Qullamaggie Episodic Pivot Gap V2 System Fit
source: qullamaggie_public_ep_translation_system_fit
version: 2
timeframe: 1d
direction: long
entry_rules:
  setup_type: episodic_pivot_gap
  min_volume_spike: 2.0
  min_volume_spike_source: cumulative_same_time
  volume_confirmation_mode: soft_marker
  min_session_relative_volume: 2.0
  min_entry_rsi: 0.0
  max_entry_rsi: 100.0
  macd_filter: none
  trend_filter: none
  require_price_above_bb_middle: false
  require_macd_histogram_positive: false
  require_price_above_vwap: false
  require_price_above_ema10: true
  require_price_above_ema20: true
  require_ema10_above_ema20: false
  min_gap_up_pct: 8.0
  min_close_location_value: 0.60
  reject_weak_close_on_high_relative_volume: true
  weak_close_max_location_value: 0.35
  weak_close_min_relative_volume: 2.0
  require_positive_news: true
  min_news_sentiment: 0.0
  veto_news_sentiment_below: -0.45
  max_news_age_hours: 36
confluence:
  enabled: false
  timeframe: 1d
  ema_period: 50
  macd_filter: none
exit_rules:
  stop_at_entry_day_low: true
  stop_atr_multiple: 2.0
  target_r_multiple: 4.0
  max_hold_hours: 2160.0
  enable_atr_trailing_stop: true
  trailing_stop_atr_multiple: 2.0
  trailing_activation_r: 1.5
  exit_on_close_below_ema20: true
  exit_on_close_below_vwap: false
  exit_on_macd_histogram_negative: false
  min_hold_bars_before_technical_exit: 3
execution:
  timeframe: 1h
  slippage_bps: 20.0
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 0
  close_buffer_minutes: 0
  friday_close_buffer_minutes: 0
