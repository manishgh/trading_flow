strategy_id: research.opening-range-breakout.v2
strategy_name: Opening Range Breakout
source: research_playbook.opening_range_breakout
version: 2
timeframe: 5m
direction: long
entry_rules:
  setup_type: opening_range_breakout
  min_volume_spike: 1.8
  min_entry_rsi: 50.0
  max_entry_rsi: 78.0
  trend_filter: vwap
  macd_filter: not_bearish
  require_price_above_bb_middle: false
  require_macd_histogram_positive: true
  require_price_above_vwap: true
  require_price_above_ema20: true
  require_price_above_ema50: false
  require_ema20_above_ema50: false
  max_vwap_extension_atr: 1.5
  opening_range_minutes: 15
  recent_high_lookback_bars: 20
  volatility_contraction_lookback_bars: 10
confluence:
  enabled: false
  timeframe: 1h
  ema_period: 50
  macd_filter: none
exit_rules:
  stop_atr_multiple: 1.5
  target_r_multiple: 2.2
  max_hold_hours: 6.5
execution:
  timeframe: 5m
  slippage_bps: 8.0
session:
  exchange_timezone: America/New_York
  quiet_minutes_after_open: 15
  close_buffer_minutes: 90
  friday_close_buffer_minutes: 120
